<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#222741"/>
      <stop offset="1" stop-color="#0d0f16"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d45f5"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>
  <!-- a disk that is also a usage chart: three slices, starting at 12 o'clock -->
  <g transform="rotate(-90 128 128)" fill="none" stroke-width="34" stroke-linecap="round">
    <circle cx="128" cy="128" r="72" stroke="#2b3048"/>
    <circle cx="128" cy="128" r="72" stroke="url(#violet)" stroke-dasharray="240 452.39"/>
    <circle cx="128" cy="128" r="72" stroke="#22d3ee" stroke-dasharray="70 452.39" stroke-dashoffset="-280"/>
    <circle cx="128" cy="128" r="72" stroke="#f472b6" stroke-dasharray="22 452.39" stroke-dashoffset="-390"/>
  </g>
  <!-- spindle -->
  <circle cx="128" cy="128" r="15" fill="#e4e7f0"/>
  <circle cx="128" cy="128" r="6" fill="#131621"/>
</svg>
