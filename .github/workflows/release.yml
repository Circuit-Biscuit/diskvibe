# Publishes a release automatically whenever the version in Cargo.toml goes up.
#
#   1. bump `version` in Cargo.toml and add a "## [<version>]" section to CHANGELOG.md
#   2. push to main
#   3. this workflow sees there's no tag v<version> yet, builds Windows, macOS and Linux
#      downloads, and publishes them as GitHub release v<version> with checksums.
#
# Pushes that don't change the version do nothing here (ci.yml still builds and tests them).
# "Run workflow" (workflow_dispatch) rebuilds every download of the current version and
# replaces the files on its release — use it to add platforms to a release made by hand.
#
# Every job uploads straight to the release, so no build-artifact or cache storage is used.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION exists; its files will be replaced."
            exit 0
          fi
          # release notes: the "## [<version>]" section of CHANGELOG.md, up to the next "## [" heading
          awk -v v="$VERSION" '/^## \[/{ if (on) exit; on = index($0, "[" v "]") > 0; next } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; fi
          printf '\n---\nDownloads: pick the file for your platform below. Check them with `SHA256SUMS.txt`.\n' >> notes.md
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --title "DiskVibe $VERSION" --target "$GITHUB_SHA" --notes-file notes.md

  windows:
    name: Windows (signed)
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    env:
      V: ${{ needs.version.outputs.version }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Sign and zip
        shell: pwsh
        run: |
          ./scripts/sign.ps1 -File target\release\diskvibe.exe
          New-Item -ItemType Directory -Force dist, portable | Out-Null
          Copy-Item target\release\diskvibe.exe portable\DiskVibe.exe
          Copy-Item packaging\DiskVibe-signing.cer portable\
          Compress-Archive -Path portable\* -DestinationPath "dist\DiskVibe-$env:V-windows-x64.zip"
          gh release upload "v$env:V" (Get-ChildItem dist).FullName --clobber --repo $env:GITHUB_REPOSITORY

  macos:
    name: macOS app (universal)
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-14
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Bundle DiskVibe.app, .dmg and the bare command-line binary
        run: |
          APP=dist/DiskVibe.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/DiskVibe" \
            target/aarch64-apple-darwin/release/diskvibe target/x86_64-apple-darwin/release/diskvibe
          sed "s/__VERSION__/$V/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          mkdir DiskVibe.iconset
          for s in 16 32 128 256; do
            sips -z $s $s assets/icon-512.png --out DiskVibe.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d assets/icon-512.png --out DiskVibe.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns DiskVibe.iconset -o "$APP/Contents/Resources/DiskVibe.icns"
          codesign --force --deep --sign - "$APP"   # ad-hoc signature (required on Apple Silicon)
          cp "$APP/Contents/MacOS/DiskVibe" diskvibe
          tar czf "dist/DiskVibe-$V-macos-universal-cli.tar.gz" diskvibe
          mkdir dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "DiskVibe $V" -srcfolder dmg -ov -format UDZO "dist/DiskVibe-$V-macos-universal.dmg"
          rm -rf dmg "$APP"
          gh release upload "v$V" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  linux:
    name: Linux AppImage
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - name: AppImage and tarball
        run: |
          mkdir -p dist AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/applications
          cp target/release/diskvibe AppDir/usr/bin/
          cp packaging/linux/diskvibe.desktop AppDir/ && cp packaging/linux/diskvibe.desktop AppDir/usr/share/applications/
          cp assets/icon.png AppDir/diskvibe.png && cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/diskvibe.png
          ln -s usr/bin/diskvibe AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "dist/DiskVibe-$V-linux-x86_64.AppImage"
          tar czf "dist/DiskVibe-$V-linux-x86_64.tar.gz" -C target/release diskvibe
          gh release upload "v$V" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Checksums and publish
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - name: Checksums
        run: |
          gh release download "v$V" --repo "$GITHUB_REPOSITORY" --dir dist
          cd dist && rm -f SHA256SUMS.txt && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
          gh release upload "v$V" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish release v${{ env.V }}
        run: gh release edit "v$V" --repo "$GITHUB_REPOSITORY" --draft=false --latest
